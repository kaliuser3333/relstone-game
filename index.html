<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Relstone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #1a1410;
  --panel: #2a1f18;
  --panel-2: #3a2a1e;
  --gold: #d4a548;
  --gold-light: #f0c674;
  --text: #f5e6c8;
  --hint: #a89070;
  --green: #6fbf73;
  --red: #c14545;
  --blue: #5a8fc4;
  --border: #5c4530;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: "Georgia", "Times New Roman", serif;
  background: radial-gradient(ellipse at top, #2a1f18 0%, #1a1410 70%);
  color: var(--text);
  margin: 0;
  padding: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.screen { width: 100%; max-width: 420px; display: none; }
.screen.active { display: block; }

/* ГЛАВНОЕ МЕНЮ */
.logo {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(212,165,72,0.5), 2px 2px 0 #000;
  margin: 20px 0 4px;
}
.logo-sub {
  text-align: center;
  color: var(--hint);
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 24px;
}
.revolver {
  text-align: center;
  font-size: 80px;
  margin: 10px 0 20px;
  filter: drop-shadow(0 0 15px rgba(212,165,72,0.4));
}
.balance-card {
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 2px solid var(--gold);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  box-shadow: 0 0 20px rgba(212,165,72,0.2), inset 0 0 30px rgba(0,0,0,0.5);
}
.balance-label { font-size: 13px; color: var(--hint); letter-spacing: 2px; }
.balance { font-size: 40px; font-weight: 900; color: var(--gold-light); margin-top: 4px; }

.menu-btns { display: flex; gap: 10px; margin-bottom: 20px; }
.menu-btn {
  flex: 1;
  padding: 16px;
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 2px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}
.menu-btn:active { transform: scale(0.97); border-color: var(--gold); }
.menu-btn.gold { border-color: var(--gold); color: var(--gold-light); }

.section-title {
  text-align: center;
  color: var(--gold);
  font-size: 16px;
  letter-spacing: 3px;
  margin: 24px 0 12px;
  font-weight: 700;
}
.game-card {
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: 0.2s;
}
.game-card:active { transform: scale(0.98); border-color: var(--gold); }
.game-icon { font-size: 40px; }
.game-info { flex: 1; }
.game-name { font-size: 18px; font-weight: 800; color: var(--gold-light); }
.game-desc { font-size: 13px; color: var(--hint); margin-top: 2px; }

/* ОБЩЕЕ ДЛЯ ЭКРАНОВ ИГР */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.back-btn {
  background: var(--panel);
  border: 2px solid var(--border);
  color: var(--gold-light);
  padding: 10px 16px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.back-btn:active { border-color: var(--gold); }
.top-balance { color: var(--gold-light); font-size: 18px; font-weight: 800; }

.panel {
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.input-row label { color: var(--hint); font-size: 13px; min-width: 70px; }
.input-field {
  flex: 1;
  background: #1a1410;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: var(--gold-light);
  font-family: inherit;
  font-size: 18px;
  font-weight: 700;
  text-align: center;
}
.input-field:focus { outline: none; border-color: var(--gold); }

.slider {
  width: 100%;
  -webkit-appearance: none;
  height: 8px;
  background: #1a1410;
  border-radius: 4px;
  outline: none;
  margin: 10px 0;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px; height: 26px;
  background: var(--gold);
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid var(--gold-light);
  box-shadow: 0 0 10px rgba(212,165,72,0.6);
}
.slider-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--hint);
  margin-top: 6px;
}
.slider-info b { color: var(--gold-light); }

.btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  transition: 0.2s;
  background: linear-gradient(135deg, var(--gold) 0%, #a87a2e 100%);
  color: #1a1410;
  box-shadow: 0 4px 0 #6b4d1e;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b4d1e; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.green { background: linear-gradient(135deg, var(--green) 0%, #4a8c4e 100%); box-shadow: 0 4px 0 #2f5c32; }

.status {
  text-align: center;
  margin: 12px 0;
  font-size: 15px;
  min-height: 22px;
  font-weight: 700;
  color: var(--gold-light);
}

/* МИНЫ */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.tile {
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 2px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  transition: 0.15s;
  user-select: none;
}
.tile:active { transform: scale(0.94); }
.tile.mine { background: var(--red); border-color: #8a2a2a; }
.tile.diamond { background: var(--blue); border-color: #3a5f8a; }

/* БОЛЬШЕ/МЕНЬШЕ */
.card-display {
  background: #1a1410;
  border: 3px solid var(--gold);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  font-size: 80px;
  font-weight: 900;
  color: var(--gold-light);
  margin-bottom: 14px;
  text-shadow: 0 0 20px rgba(212,165,72,0.6);
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}
.choice-row { display: flex; gap: 10px; margin-bottom: 14px; }
.choice {
  flex: 1;
  padding: 20px;
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 2px solid var(--border);
  border-radius: 12px;
  text-align: center;
  font-weight: 800;
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
}
.choice:active { border-color: var(--gold); transform: scale(0.97); }
</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="screen active" id="screen-menu">
  <div class="revolver">🔫</div>
  <div class="logo">RELSTONE</div>
  <div class="logo-sub">— WESTERN CASINO —</div>

  <div class="balance-card">
    <div class="balance-label">ТВОЙ БАЛАНС</div>
    <div class="balance" id="menu-balance">10 000 ₽</div>
  </div>

  <div class="menu-btns">
    <button class="menu-btn gold" onclick="deposit()">💵 Пополнить</button>
    <button class="menu-btn" onclick="withdraw()">🏦 Вывести</button>
  </div>

  <div class="section-title">— ИГРЫ —</div>

  <div class="game-card" onclick="openGame('mines')">
    <div class="game-icon">💣</div>
    <div class="game-info">
      <div class="game-name">МИНЫ</div>
      <div class="game-desc">Открывай клетки, избегай мин</div>
    </div>
    <div style="color:var(--gold); font-size:24px;">›</div>
  </div>

  <div class="game-card" onclick="openGame('hl')">
    <div class="game-icon">🎴</div>
    <div class="game-info">
      <div class="game-name">БОЛЬШЕ / МЕНЬШЕ</div>
      <div class="game-desc">Угадай карту — забери всё</div>
    </div>
    <div style="color:var(--gold); font-size:24px;">›</div>
  </div>
</div>

<!-- ЭКРАН: МИНЫ -->
<div class="screen" id="screen-mines">
  <div class="top-bar">
    <button class="back-btn" onclick="goMenu()">‹ Назад</button>
    <div class="top-balance" id="mines-balance">10 000 ₽</div>
  </div>

  <div class="panel">
    <div class="input-row">
      <label>Ставка</label>
      <input type="number" class="input-field" id="mines-bet-input" value="100" min="10">
    </div>
    <div class="input-row">
      <label>Мины</label>
      <input type="number" class="input-field" id="mines-count-input" value="3" min="1" max="24">
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="status" id="mines-status"></div>
  <button class="btn" id="mines-action" onclick="minesAction()">НАЧАТЬ ИГРУ</button>
</div>

<!-- ЭКРАН: БОЛЬШЕ/МЕНЬШЕ -->
<div class="screen" id="screen-hl">
  <div class="top-bar">
    <button class="back-btn" onclick="goMenu()">‹ Назад</button>
    <div class="top-balance" id="hl-balance">10 000 ₽</div>
  </div>

  <div class="panel">
    <div class="input-row">
      <label>Ставка</label>
      <input type="number" class="input-field" id="hl-bet-input" value="100" min="10">
    </div>
    <div style="color:var(--hint); font-size:13px; margin-bottom:4px;">
      Шанс угадать: <b id="hl-chance-label" style="color:var(--gold-light);">50%</b>
    </div>
    <input type="range" class="slider" id="hl-chance" min="10" max="90" value="50" oninput="updateChance()">
    <div class="slider-info">
      <span>Осторожно (x1.1)</span>
      <span>Риск (x10)</span>
    </div>
  </div>

  <div class="card-display" id="hl-card">?</div>

  <div class="choice-row">
    <div class="choice" onclick="hlGuess('less')">⬇️ МЕНЬШЕ</div>
    <div class="choice" onclick="hlGuess('more')">⬆️ БОЛЬШЕ</div>
  </div>

  <div class="status" id="hl-status"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ===== БАЛАНС =====
let balance = parseInt(localStorage.getItem('balance'));
if (isNaN(balance)) balance = 10000;

function fmt(n) {
  return n.toLocaleString('ru-RU') + ' ₽';
}

function updateBalance() {
  document.getElementById('menu-balance').textContent = fmt(balance);
  document.getElementById('mines-balance').textContent = fmt(balance);
  document.getElementById('hl-balance').textContent = fmt(balance);
  localStorage.setItem('balance', balance);
}

// ===== НАВИГАЦИЯ =====
function openGame(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  updateBalance();
  if (name === 'mines') buildGrid();
}

function goMenu() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-menu').classList.add('active');
  updateBalance();
}

// ===== ПОПОЛНЕНИЕ / ВЫВОД =====
function deposit() {
  const amount = prompt('Сумма пополнения (₽):', '1000');
  if (!amount) return;
  const n = parseInt(amount);
  if (isNaN(n) || n <= 0) { tg.showAlert('Неверная сумма'); return; }
  balance += n;
  updateBalance();
  tg.showAlert('✅ Пополнено на ' + fmt(n));
  tg.HapticFeedback.notificationOccurred('success');
}

function withdraw() {
  const amount = prompt('Сумма вывода (₽):', '1000');
  if (!amount) return;
  const n = parseInt(amount);
  if (isNaN(n) || n <= 0) { tg.showAlert('Неверная сумма'); return; }
  if (n > balance) { tg.showAlert('❌ Недостаточно средств'); return; }
  balance -= n;
  updateBalance();
  tg.showAlert('✅ Выведено ' + fmt(n));
  tg.HapticFeedback.notificationOccurred('success');
}

// ========================================
// ===== МИНЫ =============================
// ========================================
let minesActive = false;
let minesList = [];
let minesRevealed = [];
let minesCurrentWin = 0;
let minesBetAmount = 0;
let minesTotal = 0;

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.index = i;
    tile.onclick = () => clickTile(i);
    grid.appendChild(tile);
  }
}

function minesAction() {
  if (!minesActive) startMines();
  else cashoutMines();
}

function startMines() {
  minesBetAmount = parseInt(document.getElementById('mines-bet-input').value);
  minesTotal = parseInt(document.getElementById('mines-count-input').value);

  if (isNaN(minesBetAmount) || minesBetAmount < 10) {
    setStatus('mines', '❌ Мин. ставка 10 ₽'); return;
  }
  if (minesBetAmount > balance) {
    setStatus('mines', '❌ Недостаточно средств'); return;
  }
  if (isNaN(minesTotal) || minesTotal < 1 || minesTotal > 24) {
    setStatus('mines', '❌ Мин: 1–24'); return;
  }

  balance -= minesBetAmount;
  updateBalance();

  minesActive = true;
  minesRevealed = [];
  minesCurrentWin = minesBetAmount;
  minesList = [];
  while (minesList.length < minesTotal) {
    const r = Math.floor(Math.random() * 25);
    if (!minesList.includes(r)) minesList.push(r);
  }
  buildGrid();
  setStatus('mines', '');
  const btn = document.getElementById('mines-action');
  btn.textContent = '💰 ЗАБРАТЬ ' + fmt(minesCurrentWin);
  btn.classList.add('green');
}

function clickTile(i) {
  if (!minesActive || minesRevealed.includes(i)) return;
  minesRevealed.push(i);
  const tile = document.querySelector(`.tile[data-index="${i}"]`);

  if (minesList.includes(i)) {
    tile.classList.add('mine');
    tile.textContent = '💣';
    minesActive = false;
    minesList.forEach(m => {
      const t = document.querySelector(`.tile[data-index="${m}"]`);
      if (t) { t.classList.add('mine'); t.textContent = '💣'; }
    });
    setStatus('mines', `💥 Проигрыш! Потеряно ${fmt(minesBetAmount)}`);
    const btn = document.getElementById('mines-action');
    btn.textContent = 'НАЧАТЬ ИГРУ';
    btn.classList.remove('green');
    tg.HapticFeedback.impactOccurred('heavy');
  } else {
    tile.classList.add('diamond');
    tile.textContent = '💎';
    // Множитель зависит от кол-ва мин
    const multiplier = 1 + (minesTotal * 0.1);
    minesCurrentWin = Math.floor(minesCurrentWin * multiplier);
    document.getElementById('mines-action').textContent = '💰 ЗАБРАТЬ ' + fmt(minesCurrentWin);
    tg.HapticFeedback.impactOccurred('light');
  }
}

function cashoutMines() {
  if (!minesActive) return;
  balance += minesCurrentWin;
  updateBalance();
  setStatus('mines', `✅ Выигрыш ${fmt(minesCurrentWin)}!`);
  minesActive = false;
  const btn = document.getElementById('mines-action');
  btn.textContent = 'НАЧАТЬ ИГРУ';
  btn.classList.remove('green');
  tg.HapticFeedback.notificationOccurred('success');
}

function setStatus(game, text) {
  document.getElementById(game + '-status').textContent = text;
}

// ========================================
// ===== БОЛЬШЕ / МЕНЬШЕ ==================
// ========================================
let hlActive = false;
let hlCurrent = 0;
let hlBetAmount = 0;

function updateChance() {
  const val = parseInt(document.getElementById('hl-chance').value);
  document.getElementById('hl-chance-label').textContent = val + '%';
}

function getHlMultiplier() {
  const chance = parseInt(document.getElementById('hl-chance').value) / 100;
  return (1 / chance).toFixed(2);
}

function hlGuess(choice) {
  if (!hlActive) {
    hlBetAmount = parseInt(document.getElementById('hl-bet-input').value);
    if (isNaN(hlBetAmount) || hlBetAmount < 10) {
      setStatus('hl', '❌ Мин. ставка 10 ₽'); return;
    }
    if (hlBetAmount > balance) {
      setStatus('hl', '❌ Недостаточно средств'); return;
    }
    balance -= hlBetAmount;
    updateBalance();
    hlActive = true;
    hlCurrent = Math.floor(Math.random() * 10) + 1;
    document.getElementById('hl-card').textContent = hlCurrent;
    const mult = getHlMultiplier();
    setStatus('hl', `Ставка ${fmt(hlBetAmount)}. Коэф x${mult}. Угадывай!`);
    return;
  }

  const next = Math.floor(Math.random() * 10) + 1;
  document.getElementById('hl-card').textContent = next;

  const isMore = next > hlCurrent;
  const isLess = next < hlCurrent;
  const won = (choice === 'more' && isMore) || (choice === 'less' && isLess);

  if (won) {
    const mult = parseFloat(getHlMultiplier());
    const win = Math.floor(hlBetAmount * mult);
    balance += win;
    updateBalance();
    setStatus('hl', `🎉 Угадал! +${fmt(win - hlBetAmount)}`);
    tg.HapticFeedback.notificationOccurred('success');
  } else {
    setStatus('hl', `💀 Не угадал! Потеряно ${fmt(hlBetAmount)}`);
    tg.HapticFeedback.notificationOccurred('error');
  }

  hlActive = false;
  hlCurrent = 0;
  setTimeout(() => {
    document.getElementById('hl-card').textContent = '?';
  }, 1500);
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
updateBalance();
buildGrid();
updateChance();
</script>
</body>
</html>
